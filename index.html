<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Printing Billing System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    min-height:100vh;
}

.card{
    border:none;
}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- SIDEBAR -->

<div class="col-md-2 bg-dark text-white sidebar p-3">

<h3>🖨️ PrintSys</h3>

<hr>

<div class="d-grid gap-2">

<button class="btn btn-outline-light">
Dashboard
</button>

<button class="btn btn-outline-light">
Customers
</button>

<button class="btn btn-outline-light">
Expenses
</button>

<button class="btn btn-outline-light">
Inventory
</button>

</div>

</div>

<!-- CONTENT -->

<div class="col-md-10 p-4">

<h1>Printing Billing System</h1>

<!-- DASHBOARD -->

<div class="row mt-4">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Customers</h5>

<h2 id="customerCount">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Expenses</h5>

<h2 id="expenseCount">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Inventory Items</h5>

<h2 id="inventoryCount">0</h2>

</div>

</div>

</div>

</div>

<!-- CUSTOMER -->

<div class="card shadow mt-4">

<div class="card-header">

Add Customer

</div>

<div class="card-body">

<div class="row">

<div class="col-md-5">

<input
id="name"
class="form-control"
placeholder="Customer Name">

</div>

<div class="col-md-5">

<input
id="contact"
class="form-control"
placeholder="Contact Number">

</div>

<div class="col-md-2">

<button
class="btn btn-primary w-100"
onclick="addCustomer()">

Save

</button>

</div>

</div>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

Customer Records

</div>

<div class="card-body">

<table class="table table-bordered table-striped">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Contact</th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</div>

</div>

<!-- EXPENSE -->

<div class="card shadow mt-4">

<div class="card-header">

Add Expense

</div>

<div class="card-body">

<div class="row">

<div class="col-md-3">

<input
id="expenseCategory"
class="form-control"
placeholder="Category">

</div>

<div class="col-md-5">

<input
id="expenseDesc"
class="form-control"
placeholder="Description">

</div>

<div class="col-md-2">

<input
id="expenseAmount"
type="number"
class="form-control"
placeholder="Amount">

</div>

<div class="col-md-2">

<button
class="btn btn-success w-100"
onclick="addExpense()">

Save

</button>

</div>

</div>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

Expense Records

</div>

<div class="card-body">

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>
<th>Category</th>
<th>Description</th>
<th>Amount</th>

</tr>

</thead>

<tbody id="expenseTable">

</tbody>

</table>

</div>

</div>

<!-- INVENTORY -->

<div class="card shadow mt-4">

<div class="card-header">

Add Inventory

</div>

<div class="card-body">

<div class="row">

<div class="col-md-4">

<input
id="itemName"
class="form-control"
placeholder="Item Name">

</div>

<div class="col-md-2">

<input
id="unit"
class="form-control"
placeholder="Unit">

</div>

<div class="col-md-2">

<input
id="stock"
type="number"
class="form-control"
placeholder="Stock">

</div>

<div class="col-md-2">

<input
id="reorder"
type="number"
class="form-control"
placeholder="Min Stock">

</div>

<div class="col-md-2">

<button
class="btn btn-warning w-100"
onclick="addInventory()">

Save

</button>

</div>

</div>

</div>

</div>

<div class="card shadow mt-4">

<div class="card-header">

Inventory Items

</div>

<div class="card-body">

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>
<th>Item</th>
<th>Unit</th>
<th>Stock</th>

</tr>

</thead>

<tbody id="inventoryTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script>

const API_KEY =
'sb_publishable_3U8X7VpmckKm2FOPZCGIuw_RhbA8UMc';

const BASE_URL =
'https://gqqghtsyelrlfttwggdz.supabase.co/rest/v1';

const HEADERS = {
'apikey':API_KEY,
'Content-Type':'application/json',
'Prefer':'return=representation'
};

async function addCustomer(){

const name =
document.getElementById('name').value;

const contact =
document.getElementById('contact').value;

await fetch(
BASE_URL + '/customers',
{
method:'POST',
headers:HEADERS,
body:JSON.stringify({
customer_name:name,
contact_no:contact
})
}
);

loadCustomers();

}

async function loadCustomers(){

const response =
await fetch(
BASE_URL + '/customers?select=*',
{
headers:{
apikey:API_KEY
}
}
);

const data =
await response.json();

let html='';

data.forEach(row=>{

html+=`
<tr>
<td>${row.id}</td>
<td>${row.customer_name}</td>
<td>${row.contact_no||''}</td>
</tr>
`;

});

document.getElementById('customerTable').innerHTML=html;

document.getElementById('customerCount').innerText=
data.length;

}

async function addExpense(){

await fetch(
BASE_URL + '/expenses',
{
method:'POST',
headers:HEADERS,
body:JSON.stringify({
category:document.getElementById('expenseCategory').value,
description:document.getElementById('expenseDesc').value,
amount:Number(document.getElementById('expenseAmount').value)
})
}
);

loadExpenses();

}

async function loadExpenses(){

const response =
await fetch(
BASE_URL + '/expenses?select=*',
{
headers:{
apikey:API_KEY
}
}
);

const data =
await response.json();

let html='';

data.forEach(row=>{

html+=`
<tr>
<td>${row.id}</td>
<td>${row.category}</td>
<td>${row.description}</td>
<td>${row.amount}</td>
</tr>
`;

});

document.getElementById('expenseTable').innerHTML=html;

document.getElementById('expenseCount').innerText=
data.length;

}

async function addInventory(){

await fetch(
BASE_URL + '/inventory',
{
method:'POST',
headers:HEADERS,
body:JSON.stringify({
item_name:document.getElementById('itemName').value,
unit:document.getElementById('unit').value,
stock:Number(document.getElementById('stock').value),
reorder_level:Number(document.getElementById('reorder').value)
})
}
);

loadInventory();

}

async function loadInventory(){

const response =
await fetch(
BASE_URL + '/inventory?select=*',
{
headers:{
apikey:API_KEY
}
}
);

const data =
await response.json();

let html='';

data.forEach(row=>{

html+=`
<tr>
<td>${row.id}</td>
<td>${row.item_name}</td>
<td>${row.unit}</td>
<td>${row.stock}</td>
</tr>
`;

});

document.getElementById('inventoryTable').innerHTML=html;

document.getElementById('inventoryCount').innerText=
data.length;

}

loadCustomers();
loadExpenses();
loadInventory();

</script>

</body>
</html>
